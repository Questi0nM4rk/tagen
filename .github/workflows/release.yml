name: Release
# Publishes a v* tag to npm with trusted publishing (OIDC): no npm token.
# npmjs.com must trust this file name (release.yml) for the package.
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release below
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -er .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - name: Build binary
        run: bun run build
      - name: Run tests
        run: bun test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Ensure npm 11.5.1 or newer
        run: |
          if [ "$(printf '%s\n' 11.5.1 "$(npm -v)" | sort -V | head -n1)" != 11.5.1 ]; then
            npm install -g npm@latest
          fi
          npm -v
      - name: Publish to npm
        run: npm publish --access public --provenance
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: bin/tagen
          generate_release_notes: true
