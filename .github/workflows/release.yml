name: Release
# Stages a v* tag on npm with trusted publishing (OIDC): no npm token.
# The version goes to the npm stage queue; a maintainer approves it on npmjs.com (2FA)
# before it is live. The trusted publisher on npmjs.com names release.yml and is stage-only.
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release below
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Build binary
        run: bun run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm
        run: npm install -g npm@^11.15.0 # npm stage needs npm 11.15.0 or newer
      - name: Stage on npm
        run: npm stage publish --access public --provenance
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: bin/tagen
          generate_release_notes: true
